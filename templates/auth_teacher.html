<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Login – AI Attendance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #1e3a8a 0%, #1d4ed8 50%, #2563eb 100%); }
        .tab-active { background: #2563eb; color: white; }
        .tab-inactive { background: transparent; color: #93c5fd; }
        .spinner { border:3px solid rgba(255,255,255,0.3); border-top:3px solid white; border-radius:50%; width:20px; height:20px; animation:spin 1s linear infinite; display:inline-block; }
        @keyframes spin { to { transform:rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-md">
    <a href="/" class="flex items-center gap-2 text-blue-300 hover:text-white mb-6 transition-colors text-sm">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        Back to Home
    </a>

    <div class="bg-white rounded-3xl shadow-2xl overflow-hidden">
        <!-- Header -->
        <div class="bg-gradient-to-r from-blue-700 to-blue-500 p-8 text-white text-center">
            <div class="w-16 h-16 bg-white/20 rounded-2xl flex items-center justify-center mx-auto mb-4">
                <svg class="w-9 h-9 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                </svg>
            </div>
            <h1 class="text-2xl font-bold">Teacher Portal</h1>
            <p class="text-blue-100 text-sm mt-1">Manage lectures and student attendance</p>
        </div>

        <!-- Tabs -->
        <div class="flex border-b">
            <button id="tab-login" onclick="switchTab('login')" class="flex-1 py-3 text-sm font-semibold tab-active transition-all">Login</button>
            <button id="tab-register" onclick="switchTab('register')" class="flex-1 py-3 text-sm font-semibold tab-inactive transition-all">Register</button>
        </div>

        <div class="p-8">
            <div id="alert" class="hidden mb-4 p-3 rounded-xl text-sm font-medium"></div>

            <!-- LOGIN -->
            <div id="form-login">
                <form onsubmit="handleLogin(event)" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                        <input type="email" id="loginEmail" required placeholder="teacher@example.com"
                            class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                        <input type="password" id="loginPassword" required placeholder="Your password"
                            class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <button type="submit" id="loginBtn"
                        class="w-full bg-gradient-to-r from-blue-700 to-blue-500 text-white font-bold py-3 rounded-xl hover:opacity-90 transition-opacity flex items-center justify-center gap-2">
                        Login
                    </button>
                </form>
                <p class="text-center text-sm text-gray-500 mt-4">
                    No account? <button onclick="switchTab('register')" class="text-blue-600 font-semibold hover:underline">Register here</button>
                </p>
            </div>

            <!-- REGISTER -->
            <div id="form-register" class="hidden">
                <form onsubmit="handleRegister(event)" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                        <input type="text" id="regName" required placeholder="Prof. Jane Smith"
                            class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                        <input type="email" id="regEmail" required placeholder="teacher@example.com"
                            class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                        <input type="password" id="regPassword" required placeholder="At least 6 characters"
                            class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Department / Subject</label>
                        <input type="text" id="regDept" placeholder="e.g. Computer Science"
                            class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <div class="bg-blue-50 border border-blue-200 rounded-xl p-4 text-sm text-blue-700">
                        <strong>Note:</strong> Teacher accounts require admin approval before you can access the portal. You'll be notified once approved.
                    </div>
                    <button type="submit" id="regBtn"
                        class="w-full bg-gradient-to-r from-blue-700 to-blue-500 text-white font-bold py-3 rounded-xl hover:opacity-90 transition-opacity flex items-center justify-center gap-2">
                        Create Teacher Account
                    </button>
                </form>
                <p class="text-center text-sm text-gray-500 mt-4">
                    Already registered? <button onclick="switchTab('login')" class="text-blue-600 font-semibold hover:underline">Login here</button>
                </p>
            </div>
        </div>
    </div>
</div>

<script>
    const API = '{{ api_base }}';

    function switchTab(tab) {
        document.getElementById('form-login').classList.toggle('hidden', tab !== 'login');
        document.getElementById('form-register').classList.toggle('hidden', tab !== 'register');
        document.getElementById('tab-login').className = `flex-1 py-3 text-sm font-semibold transition-all ${tab === 'login' ? 'tab-active' : 'tab-inactive'}`;
        document.getElementById('tab-register').className = `flex-1 py-3 text-sm font-semibold transition-all ${tab === 'register' ? 'tab-active' : 'tab-inactive'}`;
        clearAlert();
    }

    function showAlert(msg, type) {
        const el = document.getElementById('alert');
        el.textContent = msg;
        el.className = `mb-4 p-3 rounded-xl text-sm font-medium ${type === 'error' ? 'bg-red-100 text-red-700 border border-red-200' : 'bg-green-100 text-green-700 border border-green-200'}`;
        el.classList.remove('hidden');
    }

    function clearAlert() { document.getElementById('alert').classList.add('hidden'); }

    async function handleLogin(e) {
        e.preventDefault();
        clearAlert();
        const btn = document.getElementById('loginBtn');
        btn.innerHTML = '<span class="spinner"></span> Logging in...';
        btn.disabled = true;
        try {
            const res = await fetch(`${API}/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email: document.getElementById('loginEmail').value,
                    password: document.getElementById('loginPassword').value
                })
            });
            const data = await res.json();
            if (res.ok) {
                if (data.user.role !== 'teacher') {
                    showAlert('This portal is for teachers only. Please use the correct portal.', 'error');
                    return;
                }
                localStorage.setItem('access_token', data.access_token);
                localStorage.setItem('user', JSON.stringify(data.user));
                showAlert('Login successful! Redirecting...', 'success');
                setTimeout(() => window.location.href = '/portal/teacher', 1000);
            } else {
                showAlert(data.error || 'Login failed', 'error');
            }
        } catch (err) {
            showAlert('Connection error: ' + err.message, 'error');
        } finally {
            btn.innerHTML = 'Login';
            btn.disabled = false;
        }
    }

    async function handleRegister(e) {
        e.preventDefault();
        clearAlert();
        const btn = document.getElementById('regBtn');
        btn.innerHTML = '<span class="spinner"></span> Creating account...';
        btn.disabled = true;
        try {
            const res = await fetch(`${API}/auth/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email: document.getElementById('regEmail').value,
                    password: document.getElementById('regPassword').value,
                    full_name: document.getElementById('regName').value,
                    role: 'teacher',
                    department: document.getElementById('regDept').value
                })
            });
            const data = await res.json();
            if (res.ok) {
                showAlert('Account created! Please login.', 'success');
                setTimeout(() => switchTab('login'), 1500);
            } else {
                showAlert(data.error || 'Registration failed', 'error');
            }
        } catch (err) {
            showAlert('Connection error: ' + err.message, 'error');
        } finally {
            btn.innerHTML = 'Create Teacher Account';
            btn.disabled = false;
        }
    }

    window.addEventListener('load', () => {
        const token = localStorage.getItem('access_token');
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        if (token && user.role === 'teacher') window.location.href = '/portal/teacher';
    });
</script>
</body>
</html>
